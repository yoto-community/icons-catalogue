name: Bug report
description: Signaler un dysfonctionnement du catalogue ou du frontend
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Merci de décrire le problème le plus précisément possible.
        Pour une **faille de sécurité**, n'utilisez pas ce formulaire (voir SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Qu'attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Ouvrir …
        2. Cliquer sur …
        3. Observer …
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL concernée
      description: Lien partageable de la vue (filtres inclus) si pertinent.
  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Frontend / UI
        - Données / scraping
        - Build / API statique
        - PWA / hors-ligne
        - Autre
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Navigateur + version, OS, mobile/desktop.
    validations:
      required: false
