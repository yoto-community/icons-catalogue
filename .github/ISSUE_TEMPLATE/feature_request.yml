name: Feature request
description: Proposer une amélioration ou une nouvelle fonctionnalité
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème / besoin
      description: Quel besoin cette fonctionnalité résout-elle ?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Décrivez le comportement souhaité.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Périmètre
      options:
        - label: Frontend / UI
        - label: Données / scraping
        - label: Build / CI
        - label: Documentation
