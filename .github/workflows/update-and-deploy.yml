name: Update Icons & Deploy

on:
  schedule:
    - cron: '0 4 * * 1'  # Tous les lundis 4h UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scrapers & build combined index
        run: pnpm run update:all
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Install unified-search dependencies
        working-directory: ./unified-search
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./unified-search
        run: pnpm run build

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit data changes
        run: |
          git add data/ dist/ unified-search/public/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update icons data ($(date -u +'%Y-%m-%d')) [skip ci]"
            git push
          else
            echo "No data changes to commit"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./unified-search/dist
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: update frontend ($(date -u +'%Y-%m-%d')) [skip ci]"