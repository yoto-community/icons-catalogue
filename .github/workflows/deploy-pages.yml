name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      # P1.5 : les données volumineuses ne sont plus versionnées ; on les
      # régénère depuis les sources `data/` avant de construire le site.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Snapshot versioned summary
        run: cp site/public/summary.json /tmp/summary.committed.json

      - name: Generate catalogue data
        run: pnpm run build:api

      - name: Check data ↔ summary.json coherence
        run: node scripts/check-summary-sync.js /tmp/summary.committed.json site/public/summary.json

      - name: Build site
        working-directory: site
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4