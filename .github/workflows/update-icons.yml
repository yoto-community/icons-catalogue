name: Weekly Icons Update

on:
  schedule:
    - cron: '0 4 * * 1'  # Tous les lundis à 4h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full update (scrape + build API)
        run: pnpm run update:all

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          # P1.5 : le gros artefact (icons.json) est ignoré
          # (régénérés au déploiement) ; seules les données sources, le résumé
          # (marqueur de version) et le README (P0.5 : section « Données
          # actuelles » régénérée par build:api) sont versionnés.
          git add data/ site/public/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly icons update ($(date -u +'%Y-%m-%d'))"
            git push
          else
            echo "No changes to commit"
          fi