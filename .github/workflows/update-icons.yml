name: Weekly Icons Update

on:
  schedule:
    - cron: '0 4 * * 1'  # Tous les lundis à 4h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        working-directory: icons-catalogue
        run: pnpm install --frozen-lockfile

      - name: Run full update (scrape + build index)
        working-directory: icons-catalogue
        run: pnpm run update:all

      - name: Copy built data to unified-search/public
        working-directory: icons-catalogue
        run: |
          cp data/combined-icons.json unified-search/public/combined-icons.json
          cp data/summary-combined.json unified-search/public/summary-combined.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icons-catalogue/data/ icons-catalogue/unified-search/public/
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly icons update ($(date -u +'%Y-%m-%d'))"
            git push
          else
            echo "No changes to commit"
          fi