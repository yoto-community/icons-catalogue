name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Typecheck (tsc --noEmit)
        run: pnpm run check

      - name: i18n keys consistency
        run: pnpm run check:i18n

      - name: Unit tests (Vitest + seuils de couverture)
        run: pnpm run test:coverage

      # P1.5 : les données volumineuses (icons.json) ne sont
      # plus versionnées ; on les régénère depuis `data/` avant le build.
      - name: Install root dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # P2.6 : `summary.json` reste versionné ; on photographie sa version
      # committée avant régénération pour détecter une dérive « data/ modifié
      # sans régénérer les compteurs » (les artefacts volumineux, eux, ne sont
      # plus suivis depuis P1.5).
      - name: Snapshot versioned summary
        working-directory: .
        run: cp site/public/summary.json /tmp/summary.committed.json

      - name: Generate catalogue data
        working-directory: .
        run: pnpm run build:api

      - name: Check data ↔ summary.json coherence
        working-directory: .
        run: node scripts/check-summary-sync.js /tmp/summary.committed.json site/public/summary.json

      # P0.5 : `build:api` régénère la section « Données actuelles » du README
      # depuis le résumé ; ce garde-fou détecte une édition manuelle divergente.
      - name: Check README data section coherence
        working-directory: .
        run: node scripts/check-readme-data.js

      - name: Production build
        run: pnpm run build

      - name: Bundle size budget
        run: pnpm run check:bundle

      - name: Repli SPA (dist/404.html)
        run: pnpm run check:spa

      - name: Précache PWA (pas de données précachées)
        run: pnpm run check:precache

      - name: SEO / partage (OG, Twitter, robots, sitemap)
        run: pnpm run check:seo

  # Les scripts Node (scrapers + build API) ne sont pas couverts par Vitest
  # (frontend) : on valide au moins leur syntaxe avant déploiement.
  scripts-syntax:
    name: Validate scraper scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check (node --check)
        run: |
          for f in scripts/*.js scripts/lib/*.js; do
            [ -e "$f" ] || continue
            node --check "$f" && echo "OK: $f"
          done

      - name: Scraper lib unit tests (node:test)
        run: pnpm run test

  # E2E : le flux de recherche dans un vrai Chromium contre la build de
  # production (Web Worker Lunr réel, données interceptées via fixture).
  # Complète les tests unitaires, qui simulent le worker.
  e2e:
    name: E2E search flow (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}

      - name: Install Chromium (+ dépendances système)
        run: pnpm exec playwright install --with-deps chromium

      # P1.5 : les données du catalogue (`index.json`, `icons-by-source/`) ne
      # sont plus versionnées. Le `webServer` de Playwright sert la build de
      # production, qui requiert ces fichiers (check-data.mjs) : on les
      # régénère depuis `data/` comme dans le job `quality`.
      - name: Install root dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Generate catalogue data
        working-directory: .
        run: pnpm run build:api

      - name: E2E (build de production + vite preview inclus)
        run: pnpm run test:e2e
