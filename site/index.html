    <!-- Partage social / SEO (P3.3) -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yoto Icons Catalogue" />

    <meta name="twitter:card" content="summary" />

    <meta name="twitter:description" content="Catalogue unifié d'icônes 16×16 pour Yoto Player : yotopixels, yotoicons et les icônes officielles Yoto." />

    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Yoto Icons Catalogue — Recherche unifiée</title>
    <!-- Applique le thème avant le premier rendu pour éviter un flash clair
         quand l'utilisateur préfère le sombre (P3.1). Doit rester synchronisé
         avec `useTheme` (`THEME_KEY`, « system » résolu via prefers-color-scheme). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('yoto-icons-theme');
          var dark =
            pref === 'dark' ||
            ((!pref || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage indisponible : on laisse le thème clair par défaut. */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
